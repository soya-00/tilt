[package]
name = "tilt"
version = "1.0.0"
description = "A thinking instrument, not a productivity tool."
authors = ["soya-00"]
edition = "2021"
rust-version = "1.77"

# The shell owns four things and no product logic: the windows, the global
# hotkey, the tray, and the lifetime of the Python core it spawns.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is what allows a transparent window, which the quick
# capture panel needs in order to sit on real system vibrancy. It also rules out
# Mac App Store distribution — a fair trade for an app shipped as a .dmg.
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
# Handing a link to the system browser. The webview must never navigate to one
# itself: a page that opened inside Tilt would be a browser nobody asked for,
# sitting on top of the journal with no way back.
tauri-plugin-opener = "2"
serde_json = "1"
getrandom = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
