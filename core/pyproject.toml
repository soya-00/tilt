[project]
name = "tilt-core"
version = "0.1.0"
description = "Tilt core — journal store, index, and agent layer"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-frontmatter>=1.1",
    "python-ulid>=3.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tilt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:tilt.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008 flags `Depends(...)` in argument defaults, which is FastAPI's documented
# dependency-injection idiom rather than the mutable-default bug the rule targets.
ignore = ["B008"]
