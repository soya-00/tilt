[project]
name = "tilt-core"
version = "0.3.0"
description = "Tilt core — journal store, index, and agent layer"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-frontmatter>=1.1",
    "python-ulid>=3.0",
    "httpx>=0.27",
    # Not an extra: running Gemini is the point of the app, and making it
    # optional meant saving an API key failed with an install error.
    "google-genai>=1.0",
    # Unattended jobs need a scheduler that survives a sleeping laptop: missed
    # runs coalesce instead of stampeding on wake.
    "apscheduler>=3.11,<4",
    # Pure Python, no native build, no system library. Text extraction only —
    # anything needing OCR is out of scope and says so rather than guessing.
    "pypdf>=5.1",
    # Uploading a PDF is a multipart POST, and FastAPI refuses to define such a
    # route at import time without this — a missing extra would take the whole
    # service down, not just the upload.
    "python-multipart>=0.0.18",
    # The API key belongs in the OS keychain rather than in a file anyone
    # running as you can read. Falls back to the file where there is no
    # keychain — a container, CI — and says so rather than downgrading
    # silently.
    "keyring>=25.5",
]

[project.scripts]
# The name the desktop shell spawns, both from source and once bundled.
tilt-core = "tilt.serve:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]
package = [
    # Only needed to build the sidecar binary, never at runtime.
    "pyinstaller>=6.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tilt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:tilt.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008 flags `Depends(...)` in argument defaults, which is FastAPI's documented
# dependency-injection idiom rather than the mutable-default bug the rule targets.
ignore = ["B008"]
